[pytest]
testpaths = tests
addopts = --strict-markers
 --tracing retain-on-failure 
 --screenshot only-on-failure 
 --video retain-on-failure 
 --output test-results
markers = 
    smoke:critical-path test ,run on every push
    regression : full regression-suite
filterwarnings =
    # pytest-playwright's base_url fixture triggers a pytest 10 deprecation; remove after plugin upgrade
    ignore:Session-scoped fixtures defined as instance methods